app:
  jwt:
    public_keys_url: classpath:local-development/jwks.json

luontotieto:
  aws:
    region: "eu-north-1"
  s3mock:
    url: "https://${S3_HOST:localhost}:${S3_PORT:9876}"
  bucket:
    data: "data"
    proxy_through_nginx: false
    verify_file_av_tagged: false
  email:
    enabled: "false"
    region: "fake"
    sender_address: "fake"
    sender_arn: "fake"
  host: "http://localhost:9000"
  geoserver:
    base_url: "${GEOSERVER_URL:http://localhost:8000/}"
    username: "${GEOSERVER_USERNAME:admin}"
    password: "${GEOSERVER_PASSWORD:password}"

spring:
  datasource:
    luontotieto:
      jdbcUrl: "jdbc:postgresql://${LUONTOTIETO_DB_HOST:localhost}:${LUONTOTIETO_DB_PORT:5432}/luontotieto_it"
      username: "luontotieto"
      password: "postgres"
    paikkatieto:
      # GeoServer serves the WFS from the paikkatietodb database, so the e2e compose
      # file points the service to the same database
      jdbcUrl: "jdbc:postgresql://${PAIKKATIETO_DB_HOST:localhost}:${PAIKKATIETO_DB_PORT:5433}/${PAIKKATIETO_DB_NAME:paikkatietodb_it}"
      username: "paikkatietodb"
      password: "postgres"
